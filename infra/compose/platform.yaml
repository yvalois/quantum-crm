name: quantum-platform

x-service-defaults: &service-defaults
  init: true
  read_only: true
  restart: unless-stopped
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  admin-web:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/admin-web@sha256:${QCRM_ADMIN_WEB_DIGEST:?set QCRM_ADMIN_WEB_DIGEST}"
    pull_policy: always
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_ADMIN_WEB_ORIGIN: "${QCRM_ADMIN_WEB_ORIGIN:?set QCRM_ADMIN_WEB_ORIGIN}"
      QCRM_ADMIN_API_ORIGIN: http://admin-api:3002
      QCRM_OIDC_ISSUER: "${QCRM_PLATFORM_OIDC_ISSUER:?set QCRM_PLATFORM_OIDC_ISSUER}"
      QCRM_OIDC_CLIENT_ID: "${QCRM_ADMIN_WEB_OIDC_CLIENT_ID:-quantum-admin-web}"
      QCRM_OIDC_CLIENT_SECRET_FILE: /run/secrets/qcrm_oidc_client_secret
      QCRM_SESSION_REDIS_URL_FILE: /run/secrets/qcrm_session_redis_url
    secrets:
      - source: admin-web-oidc-client-secret
        target: qcrm_oidc_client_secret
      - source: admin-web-session-redis-url
        target: qcrm_session_redis_url
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [platform-edge, platform-internal, platform-session]

  admin-api:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/admin-api@sha256:${QCRM_ADMIN_API_DIGEST:?set QCRM_ADMIN_API_DIGEST}"
    pull_policy: always
    environment:
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_HOST: 0.0.0.0
      QCRM_PORT: "3002"
      QCRM_DATABASE_URL_FILE: /run/secrets/qcrm_database_url
      QCRM_OIDC_ISSUER: "${QCRM_PLATFORM_OIDC_ISSUER:?set QCRM_PLATFORM_OIDC_ISSUER}"
      QCRM_OIDC_AUDIENCE: "${QCRM_PLATFORM_OIDC_AUDIENCE:?set QCRM_PLATFORM_OIDC_AUDIENCE}"
      QCRM_OIDC_REQUIRED_ACR: "${QCRM_PLATFORM_OIDC_REQUIRED_ACR:?set QCRM_PLATFORM_OIDC_REQUIRED_ACR}"
      QCRM_OIDC_MAX_TOKEN_AGE_SECONDS: "${QCRM_PLATFORM_OIDC_MAX_TOKEN_AGE_SECONDS:-300}"
    secrets:
      - source: platform-database-url
        target: qcrm_database_url
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [platform-internal, platform-database, platform-oidc]

  deploy-executor:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/deploy-executor@sha256:${QCRM_DEPLOY_EXECUTOR_DIGEST:?set QCRM_DEPLOY_EXECUTOR_DIGEST}"
    pull_policy: always
    environment:
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_HOST: 0.0.0.0
      QCRM_PORT: "3102"
      QCRM_DATABASE_URL_FILE: /run/secrets/qcrm_database_url
      QCRM_DATABASE_ADMIN_URL_FILE: /run/secrets/qcrm_database_admin_url
      QCRM_TENANT_SECRET_DIRECTORY: /run/tenant-secrets
    secrets:
      - source: platform-database-url
        target: qcrm_database_url
      - source: platform-provisioner-database-url
        target: qcrm_database_admin_url
    volumes:
      - type: bind
        source: "${QCRM_TENANT_SECRET_BIND_SOURCE:?set QCRM_TENANT_SECRET_BIND_SOURCE}"
        target: /run/tenant-secrets
        read_only: false
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3102/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [platform-internal, platform-database, platform-storage]

networks:
  platform-edge:
    external: true
    name: "${QCRM_PLATFORM_EDGE_NETWORK:?set QCRM_PLATFORM_EDGE_NETWORK}"
  platform-internal:
    internal: true
  platform-database:
    external: true
    name: "${QCRM_PLATFORM_DATABASE_NETWORK:?set QCRM_PLATFORM_DATABASE_NETWORK}"
  platform-session:
    external: true
    name: "${QCRM_PLATFORM_SESSION_NETWORK:?set QCRM_PLATFORM_SESSION_NETWORK}"
  platform-oidc:
    external: true
    name: "${QCRM_PLATFORM_OIDC_NETWORK:?set QCRM_PLATFORM_OIDC_NETWORK}"
  platform-storage:
    external: true
    name: "${QCRM_PLATFORM_STORAGE_NETWORK:?set QCRM_PLATFORM_STORAGE_NETWORK}"

secrets:
  admin-web-oidc-client-secret:
    file: "${QCRM_ADMIN_WEB_OIDC_CLIENT_SECRET_FILE:?set QCRM_ADMIN_WEB_OIDC_CLIENT_SECRET_FILE}"
  admin-web-session-redis-url:
    file: "${QCRM_ADMIN_WEB_SESSION_REDIS_URL_FILE:?set QCRM_ADMIN_WEB_SESSION_REDIS_URL_FILE}"
  platform-database-url:
    file: "${QCRM_PLATFORM_DATABASE_URL_SECRET_FILE:?set QCRM_PLATFORM_DATABASE_URL_SECRET_FILE}"
  platform-provisioner-database-url:
    file: "${QCRM_PLATFORM_PROVISIONER_DATABASE_URL_SECRET_FILE:?set QCRM_PLATFORM_PROVISIONER_DATABASE_URL_SECRET_FILE}"
