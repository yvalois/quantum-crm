x-service-defaults: &service-defaults
  init: true
  read_only: true
  restart: unless-stopped
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  crm-migrator:
    <<: *service-defaults
    restart: "no"
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/crm-migrator@sha256:${QCRM_CRM_MIGRATOR_DIGEST:?set QCRM_CRM_MIGRATOR_DIGEST}"
    pull_policy: never
    environment:
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_MIGRATION_DATABASE_URL_FILE: /run/secrets/qcrm_migration_database_url
    secrets:
      - source: crm-migration-database-url
        target: qcrm_migration_database_url
    networks: [platform-database]

  crm-web:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/crm-web@sha256:${QCRM_CRM_WEB_DIGEST:?set QCRM_CRM_WEB_DIGEST}"
    pull_policy: never
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_TENANT_ID: "${QCRM_TENANT_ID:?set QCRM_TENANT_ID}"
      QCRM_CRM_WEB_ORIGIN: "${QCRM_CRM_WEB_ORIGIN:?set QCRM_CRM_WEB_ORIGIN}"
      QCRM_CRM_API_ORIGIN: "${QCRM_CRM_API_ORIGIN:?set QCRM_CRM_API_ORIGIN}"
      QCRM_OIDC_ISSUER: "${QCRM_OIDC_ISSUER:?set QCRM_OIDC_ISSUER}"
      QCRM_OIDC_CLIENT_ID: "${QCRM_OIDC_CLIENT_ID:?set QCRM_OIDC_CLIENT_ID}"
      QCRM_OIDC_CLIENT_SECRET_FILE: /run/secrets/qcrm_oidc_client_secret
      QCRM_SESSION_REDIS_URL_FILE: /run/secrets/qcrm_session_redis_url
    secrets:
      - source: crm-oidc-client-secret
        target: qcrm_oidc_client_secret
      - source: crm-session-redis-url
        target: qcrm_session_redis_url
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      tenant-edge:
        aliases:
          - "${QCRM_TENANT_CRM_WEB_EDGE_ALIAS:?set QCRM_TENANT_CRM_WEB_EDGE_ALIAS}"
      tenant-internal: {}
      platform-session: {}
      platform-oidc: {}

  portal-web:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/portal-web@sha256:${QCRM_PORTAL_WEB_DIGEST:?set QCRM_PORTAL_WEB_DIGEST}"
    pull_policy: never
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      tenant-edge:
        aliases:
          - "${QCRM_TENANT_PORTAL_WEB_EDGE_ALIAS:?set QCRM_TENANT_PORTAL_WEB_EDGE_ALIAS}"

  api:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/api@sha256:${QCRM_API_DIGEST:?set QCRM_API_DIGEST}"
    pull_policy: never
    environment:
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_HOST: 0.0.0.0
      QCRM_PORT: "3001"
      QCRM_TENANT_ID: "${QCRM_TENANT_ID:?set QCRM_TENANT_ID}"
      QCRM_DATABASE_URL_FILE: /run/secrets/qcrm_database_url
      QCRM_OIDC_ISSUER: "${QCRM_OIDC_ISSUER:?set QCRM_OIDC_ISSUER}"
      QCRM_OIDC_AUDIENCE: "${QCRM_OIDC_AUDIENCE:?set QCRM_OIDC_AUDIENCE}"
      QCRM_OIDC_REQUIRED_ACR: "${QCRM_OIDC_REQUIRED_ACR:?set QCRM_OIDC_REQUIRED_ACR}"
      QCRM_OIDC_MAX_TOKEN_AGE_SECONDS: "${QCRM_OIDC_MAX_TOKEN_AGE_SECONDS:?set QCRM_OIDC_MAX_TOKEN_AGE_SECONDS}"
      QCRM_IAM_BOOTSTRAP_CLIENT_ID: "${QCRM_IAM_BOOTSTRAP_CLIENT_ID:?set QCRM_IAM_BOOTSTRAP_CLIENT_ID}"
      QCRM_IAM_BOOTSTRAP_CLIENT_SECRET_FILE: /run/secrets/qcrm_iam_bootstrap_client_secret
      QCRM_FILES_S3_ENDPOINT: http://platform-storage:8333
      QCRM_FILES_S3_PUBLIC_ENDPOINT: "${QCRM_FILES_S3_PUBLIC_ENDPOINT:?set QCRM_FILES_S3_PUBLIC_ENDPOINT}"
      QCRM_FILES_S3_REGION: "${QCRM_FILES_S3_REGION:-us-east-1}"
      QCRM_FILES_INCOMING_BUCKET: "${QCRM_FILES_INCOMING_BUCKET:?set QCRM_FILES_INCOMING_BUCKET}"
      QCRM_FILES_OBJECTS_BUCKET: "${QCRM_FILES_OBJECTS_BUCKET:?set QCRM_FILES_OBJECTS_BUCKET}"
      QCRM_FILES_S3_REQUEST_TIMEOUT_MS: "${QCRM_FILES_S3_REQUEST_TIMEOUT_MS:-10000}"
      QCRM_FILES_UPLOAD_TTL_SECONDS: "${QCRM_FILES_UPLOAD_TTL_SECONDS:-600}"
      QCRM_FILES_DOWNLOAD_TTL_SECONDS: "${QCRM_FILES_DOWNLOAD_TTL_SECONDS:-60}"
      QCRM_FILES_S3_UPLOAD_ACCESS_KEY_FILE: /run/secrets/qcrm_files_s3_upload_access_key
      QCRM_FILES_S3_UPLOAD_SECRET_KEY_FILE: /run/secrets/qcrm_files_s3_upload_secret_key
      QCRM_FILES_S3_DELIVERY_ACCESS_KEY_FILE: /run/secrets/qcrm_files_s3_delivery_access_key
      QCRM_FILES_S3_DELIVERY_SECRET_KEY_FILE: /run/secrets/qcrm_files_s3_delivery_secret_key
    secrets:
      - source: crm-database-url
        target: qcrm_database_url
      - source: iam-bootstrap-client-secret
        target: qcrm_iam_bootstrap_client_secret
      - source: files-s3-upload-access-key
        target: qcrm_files_s3_upload_access_key
      - source: files-s3-upload-secret-key
        target: qcrm_files_s3_upload_secret_key
      - source: files-s3-delivery-access-key
        target: qcrm_files_s3_delivery_access_key
      - source: files-s3-delivery-secret-key
        target: qcrm_files_s3_delivery_secret_key
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      tenant-edge:
        aliases:
          - "${QCRM_TENANT_API_EDGE_ALIAS:?set QCRM_TENANT_API_EDGE_ALIAS}"
      tenant-internal: {}
      platform-database: {}
      platform-storage: {}
      platform-oidc: {}
      platform-session:
        aliases:
          - "${QCRM_TENANT_BOOTSTRAP_API_ALIAS:?set QCRM_TENANT_BOOTSTRAP_API_ALIAS}"

  worker:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/worker@sha256:${QCRM_WORKER_DIGEST:?set QCRM_WORKER_DIGEST}"
    pull_policy: never
    environment:
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_HOST: 0.0.0.0
      QCRM_PORT: "3101"
      QCRM_TENANT_ID: "${QCRM_TENANT_ID:?set QCRM_TENANT_ID}"
      QCRM_DATABASE_URL_FILE: /run/secrets/qcrm_database_url
      QCRM_FILES_S3_ENDPOINT: http://platform-storage:8333
      QCRM_FILES_S3_REGION: "${QCRM_FILES_S3_REGION:-us-east-1}"
      QCRM_FILES_INCOMING_BUCKET: "${QCRM_FILES_INCOMING_BUCKET:?set QCRM_FILES_INCOMING_BUCKET}"
      QCRM_FILES_OBJECTS_BUCKET: "${QCRM_FILES_OBJECTS_BUCKET:?set QCRM_FILES_OBJECTS_BUCKET}"
      QCRM_FILES_S3_REQUEST_TIMEOUT_MS: "${QCRM_FILES_S3_REQUEST_TIMEOUT_MS:-10000}"
      QCRM_FILES_S3_PROCESSOR_ACCESS_KEY_FILE: /run/secrets/qcrm_files_s3_processor_access_key
      QCRM_FILES_S3_PROCESSOR_SECRET_KEY_FILE: /run/secrets/qcrm_files_s3_processor_secret_key
      QCRM_FILES_CLAMAV_HOST: platform-clamav
      QCRM_FILES_CLAMAV_PORT: "3310"
      QCRM_FILES_CLAMAV_TIMEOUT_MS: "${QCRM_FILES_CLAMAV_TIMEOUT_MS:-30000}"
      QCRM_FILES_CLAMAV_MAX_SIGNATURE_AGE_SECONDS: "${QCRM_FILES_CLAMAV_MAX_SIGNATURE_AGE_SECONDS:-172800}"
      QCRM_FILES_WORKER_POLL_INTERVAL_MS: "${QCRM_FILES_WORKER_POLL_INTERVAL_MS:-2000}"
      QCRM_FILES_WORKER_LEASE_SECONDS: "${QCRM_FILES_WORKER_LEASE_SECONDS:-300}"
    secrets:
      - source: crm-database-url
        target: qcrm_database_url
      - source: files-s3-processor-access-key
        target: qcrm_files_s3_processor_access_key
      - source: files-s3-processor-secret-key
        target: qcrm_files_s3_processor_secret_key
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3101/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [tenant-internal, platform-database, platform-storage]

  agent-runtime:
    <<: *service-defaults
    image: "${QCRM_IMAGE_REGISTRY:?set QCRM_IMAGE_REGISTRY}/agent-runtime@sha256:${QCRM_AGENT_RUNTIME_DIGEST:?set QCRM_AGENT_RUNTIME_DIGEST}"
    pull_policy: never
    environment:
      QCRM_ENV: "${QCRM_ENV:?set QCRM_ENV}"
      QCRM_HOST: 0.0.0.0
      QCRM_PORT: "3103"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3103/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [tenant-internal]

networks:
  tenant-edge:
    external: true
    name: "${QCRM_TENANT_EDGE_NETWORK:?set QCRM_TENANT_EDGE_NETWORK}"
  tenant-internal:
    internal: true
  platform-storage:
    external: true
    name: "${QCRM_PLATFORM_STORAGE_NETWORK:?set QCRM_PLATFORM_STORAGE_NETWORK}"
  platform-database:
    external: true
    name: "${QCRM_PLATFORM_DATABASE_NETWORK:?set QCRM_PLATFORM_DATABASE_NETWORK}"
  platform-session:
    external: true
    name: "${QCRM_PLATFORM_SESSION_NETWORK:?set QCRM_PLATFORM_SESSION_NETWORK}"
  platform-oidc:
    external: true
    name: "${QCRM_PLATFORM_OIDC_NETWORK:?set QCRM_PLATFORM_OIDC_NETWORK}"

secrets:
  crm-migration-database-url:
    file: "${QCRM_CRM_MIGRATION_DATABASE_URL_SECRET_FILE:?set QCRM_CRM_MIGRATION_DATABASE_URL_SECRET_FILE}"
  crm-database-url:
    file: "${QCRM_CRM_DATABASE_URL_SECRET_FILE:?set QCRM_CRM_DATABASE_URL_SECRET_FILE}"
  iam-bootstrap-client-secret:
    file: "${QCRM_IAM_BOOTSTRAP_CLIENT_SECRET_HOST_FILE:?set QCRM_IAM_BOOTSTRAP_CLIENT_SECRET_HOST_FILE}"
  crm-oidc-client-secret:
    file: "${QCRM_CRM_OIDC_CLIENT_SECRET_FILE:?set QCRM_CRM_OIDC_CLIENT_SECRET_FILE}"
  crm-session-redis-url:
    file: "${QCRM_CRM_SESSION_REDIS_URL_SECRET_FILE:?set QCRM_CRM_SESSION_REDIS_URL_SECRET_FILE}"
  files-s3-upload-access-key:
    file: "${QCRM_FILES_S3_UPLOAD_ACCESS_KEY_SECRET_FILE:?set QCRM_FILES_S3_UPLOAD_ACCESS_KEY_SECRET_FILE}"
  files-s3-upload-secret-key:
    file: "${QCRM_FILES_S3_UPLOAD_SECRET_KEY_SECRET_FILE:?set QCRM_FILES_S3_UPLOAD_SECRET_KEY_SECRET_FILE}"
  files-s3-delivery-access-key:
    file: "${QCRM_FILES_S3_DELIVERY_ACCESS_KEY_SECRET_FILE:?set QCRM_FILES_S3_DELIVERY_ACCESS_KEY_SECRET_FILE}"
  files-s3-delivery-secret-key:
    file: "${QCRM_FILES_S3_DELIVERY_SECRET_KEY_SECRET_FILE:?set QCRM_FILES_S3_DELIVERY_SECRET_KEY_SECRET_FILE}"
  files-s3-processor-access-key:
    file: "${QCRM_FILES_S3_PROCESSOR_ACCESS_KEY_SECRET_FILE:?set QCRM_FILES_S3_PROCESSOR_ACCESS_KEY_SECRET_FILE}"
  files-s3-processor-secret-key:
    file: "${QCRM_FILES_S3_PROCESSOR_SECRET_KEY_SECRET_FILE:?set QCRM_FILES_S3_PROCESSOR_SECRET_KEY_SECRET_FILE}"
