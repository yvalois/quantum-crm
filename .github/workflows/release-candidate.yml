name: release-candidate

on:
  workflow_run:
    workflows:
      - quality
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-candidate-main
  cancel-in-progress: false

jobs:
  publish:
    name: release / publish ${{ matrix.app }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: crm-web
            dockerfile: infra/docker/Dockerfile.web
          - app: portal-web
            dockerfile: infra/docker/Dockerfile.web
          - app: admin-web
            dockerfile: infra/docker/Dockerfile.web
          - app: api
            dockerfile: infra/docker/Dockerfile.node
          - app: admin-api
            dockerfile: infra/docker/Dockerfile.node
          - app: worker
            dockerfile: infra/docker/Dockerfile.node
          - app: deploy-executor
            dockerfile: infra/docker/Dockerfile.node
          - app: agent-runtime
            dockerfile: infra/docker/Dockerfile.node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
